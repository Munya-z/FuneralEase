[versions]
agp                 = "9.2.1"
kotlin              = "2.2.10"
composeBom          = "2025.06.00"
activityCompose     = "1.10.1"
hiltNavigationCompose = "1.3.0"
coreKtx             = "1.16.0"
appcompat           = "1.7.1"
lifecycle           = "2.9.1"
navigation          = "2.9.0"
hilt                = "2.56.1"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
moshi               = "1.15.1"
room                = "2.7.1"
datastore           = "1.1.2"
coroutines          = "1.10.2"
securityCrypto      = "1.1.0-alpha06"
coil                = "2.7.0"
junit               = "4.13.2"
junitExt            = "1.2.1"
espresso            = "3.6.1"
mockk               = "1.13.12"

[libraries]
# AndroidX
androidx-core-ktx           = { group = "androidx.core",          name = "core-ktx",                     version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",      name = "appcompat",                    version.ref = "appcompat" }

# Compose
compose-bom                 = { group = "androidx.compose",            name = "compose-bom",               version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",         name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",         name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3",  name = "material3" }
compose-icons-extended      = { group = "androidx.compose.material",   name = "material-icons-extended" }
activity-compose            = { group = "androidx.activity",           name = "activity-compose",          version.ref = "activityCompose" }
navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",        version.ref = "navigation" }
hilt-navigation-compose     = { group = "androidx.hilt",               name = "hilt-navigation-compose",   version.ref = "hiltNavigationCompose" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
coil-compose                = { group = "io.coil-kt",                  name = "coil-compose",              version.ref = "coil" }

# Lifecycle / ViewModel
lifecycle-viewmodel-ktx     = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-ktx",      version.ref = "lifecycle" }
lifecycle-livedata-ktx      = { group = "androidx.lifecycle",     name = "lifecycle-livedata-ktx",       version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }

# Navigation
navigation-fragment-ktx     = { group = "androidx.navigation",    name = "navigation-fragment-ktx",      version.ref = "navigation" }
navigation-ui-ktx           = { group = "androidx.navigation",    name = "navigation-ui-ktx",            version.ref = "navigation" }

# Hilt DI
hilt-android                = { group = "com.google.dagger",      name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",      name = "hilt-android-compiler",        version.ref = "hilt" }

# Retrofit + OkHttp
retrofit                    = { group = "com.squareup.retrofit2",  name = "retrofit",                     version.ref = "retrofit" }
retrofit-moshi              = { group = "com.squareup.retrofit2",  name = "converter-moshi",              version.ref = "retrofit" }
okhttp-logging              = { group = "com.squareup.okhttp3",    name = "logging-interceptor",          version.ref = "okhttp" }

# Moshi
moshi-kotlin                = { group = "com.squareup.moshi",     name = "moshi-kotlin",                 version.ref = "moshi" }
moshi-codegen               = { group = "com.squareup.moshi",     name = "moshi-kotlin-codegen",         version.ref = "moshi" }

# Room
room-runtime                = { group = "androidx.room",          name = "room-runtime",                 version.ref = "room" }
room-ktx                    = { group = "androidx.room",          name = "room-ktx",                     version.ref = "room" }
room-compiler               = { group = "androidx.room",          name = "room-compiler",                version.ref = "room" }

# DataStore (token storage)
datastore-preferences       = { group = "androidx.datastore",     name = "datastore-preferences",        version.ref = "datastore" }

# Security
security-crypto             = { group = "androidx.security",      name = "security-crypto",              version.ref = "securityCrypto" }

# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",   version.ref = "coroutines" }

# Coil (image loading)
coil                        = { group = "io.coil-kt",             name = "coil",                         version.ref = "coil" }

# Testing
junit                       = { group = "junit",                  name = "junit",                        version.ref = "junit" }
androidx-junit-ext          = { group = "androidx.test.ext",      name = "junit",                        version.ref = "junitExt" }
androidx-espresso           = { group = "androidx.test.espresso", name = "espresso-core",                version.ref = "espresso" }
mockk                       = { group = "io.mockk",               name = "mockk",                        version.ref = "mockk" }

[plugins]
android-application         = { id = "com.android.application",                version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
kotlin-kapt                 = { id = "org.jetbrains.kotlin.kapt",              version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android",         version.ref = "hilt" }
